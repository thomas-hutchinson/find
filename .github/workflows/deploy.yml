name: Deploy to GitHub Pages

# Builds the PWA and publishes the static site to the `gh-pages` branch.
# Point Pages at that branch once (Settings → Pages → Deploy from a branch
# → gh-pages / root) and every push redeploys automatically.

on:
  push:
    branches:
      - claude/jolly-ramanujan-1lsgqo
      - main
  workflow_dispatch:

# Needed so the built-in token can push the built site to gh-pages.
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Prepare static site
        run: |
          # SPA fallback + opt out of Jekyll processing.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA} to GitHub Pages"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
